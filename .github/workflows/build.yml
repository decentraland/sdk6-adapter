name: Build adapter

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run package
      - name: Attest runtime and provenance
        if: github.event_name != 'pull_request'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/artifact/sdk6-adapter.min.js
            release/artifact/provenance.json
      - name: Preserve signed attestation
        if: github.event_name != 'pull_request'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" release/artifact/attestation.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: sdk6-adapter-${{ github.sha }}-${{ github.run_attempt }}
          path: release/artifact/
          compression-level: 9
          if-no-files-found: error
          retention-days: 90
      - name: Build summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          node - <<'JS' >> "$GITHUB_STEP_SUMMARY"
          const p = require('./release/artifact/provenance.json')
          console.log(`Runtime: ${p.bytes} bytes\n\nSHA-256: \`${p.sha256}\`\n\nSource: \`${p.source.commit}\`\n\n[Build](${p.build.runUrl}) · [Download](${process.env.ARTIFACT_URL})`)
          JS
